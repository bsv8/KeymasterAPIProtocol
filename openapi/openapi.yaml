openapi: 3.1.0
info:
  title: Keymaster API
  version: v1
  description: |
    Keymaster 后台业务 API v1 契约（忠实盘点）。
    HTTP 与内存 transport 共用路由、校验与语义。
    错误响应首轮保持现有 v1 文本行为，不偷换为统一 JSON；
    本文件只冻结可观察的路径、方法、请求、响应与状态码。
    协议版本由 /api/status 的 product/apiVersion 标识：
    product 固定 "km"，apiVersion 固定 "v1"。
    订阅恢复语义见同仓 docs/事件协议.md（快照+序号+实例ID，
    初版重连即重取快照，不承诺历史重放）。
servers:
  - url: http://127.0.0.1:8790
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: 后台状态与协议标识
      responses:
        '200':
          description: 状态（未初始化时仅含 initialized/state/product/apiVersion）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/info:
    get:
      operationId: getInfo
      summary: 钱包信息与余额
      responses:
        '200':
          description: 信息与余额或余额错误（error+cached 口径冻结）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
        '412':
          $ref: '#/components/responses/NotInitialized'
  /api/unlock:
    post:
      operationId: unlock
      summary: 解锁后台（密码为敏感请求字段，永不出现在响应/事件/日志）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
      responses:
        '200':
          description: 已解锁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 密码错误
        '412':
          $ref: '#/components/responses/NotInitialized'
  /api/roots:
    get:
      operationId: listRoots
      summary: 售卖根列表
      responses:
        '200':
          description: 根列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootsView'
        '412':
          $ref: '#/components/responses/NotInitialized'
    post:
      operationId: addRoot
      summary: 新增售卖根
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRootRequest'
      responses:
        '200':
          description: 已新增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddRootResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
        '503':
          $ref: '#/components/responses/Stopping'
    delete:
      operationId: deleteRoot
      summary: 删除售卖根（确切路径，与 /api/roots/ 互为别名）
      parameters:
        - $ref: '#/components/parameters/RootIdQuery'
        - $ref: '#/components/parameters/RevisionQuery'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionedOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/NotInitialized'
        '423':
          $ref: '#/components/responses/Locked'
  /api/roots/:
    delete:
      operationId: deleteRootSlash
      summary: 删除售卖根（尾斜杠别名）
      parameters:
        - $ref: '#/components/parameters/RootIdQuery'
        - $ref: '#/components/parameters/RevisionQuery'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionedOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
  /api/roots/default:
    put:
      operationId: setDefaultRoot
      summary: 设置默认下载根（PUT）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultRootRequest'
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionedOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: setDefaultRootPost
      summary: 设置默认下载根（POST 别名）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultRootRequest'
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionedOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/files:
    get:
      operationId: listFiles
      summary: 全部售卖文件视图
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesView'
        '412':
          $ref: '#/components/responses/NotInitialized'
  /api/browse:
    get:
      operationId: browse
      summary: 目录浏览（仅子目录名，不返回文件内容）
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 目录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/NotInitialized'
  /api/settings:
    get:
      operationId: getSettings
      summary: 普通参数设置全文
      responses:
        '200':
          description: 设置全文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '412':
          $ref: '#/components/responses/NotInitialized'
    put:
      operationId: updateSettings
      summary: 部分更新设置（指针语义：省略不动，显式零值参与校验）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: 更新后全文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Stopping'
  /api/settings/reset:
    post:
      operationId: resetSettings
      summary: 恢复出厂（只重置普通参数，保留钱包身份与业务数据）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: 重置后全文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Stopping'
  /api/catalog/refresh:
    post:
      operationId: refreshCatalog
      summary: 刷新目录索引（rootId 缺省表示全部）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRefreshRequest'
      responses:
        '200':
          description: 单根返回原生报告对象，多根返回 refreshed 数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/collector/status:
    get:
      operationId: collectorStatus
      summary: 采集器状态
      responses:
        '200':
          description: 采集器状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorStatus'
        '412':
          $ref: '#/components/responses/NotInitialized'
  /api/collector/history:
    get:
      operationId: collectorHistory
      summary: 提交历史（倒序，最多 100）
      responses:
        '200':
          description: 提交历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/NotInitialized'
  /api/collector/description:
    post:
      operationId: collectorDescribe
      summary: 保存文件描述并重新入队
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorDescriptionRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/collector/config:
    post:
      operationId: collectorConfig
      summary: 经统一设置路径替换采集器目标与间隔
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorConfigRequest'
      responses:
        '200':
          description: 已应用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/NotInitialized'
        '503':
          $ref: '#/components/responses/Stopping'
  /api/collector/flush:
    post:
      operationId: collectorFlush
      summary: 立即触发各采集器提交
      responses:
        '200':
          description: 已触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorFlushResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Stopping'
  /api/collector/retry:
    post:
      operationId: collectorRetry
      summary: 原样重发在途批次
      responses:
        '200':
          description: 已重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorRetryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/pricing/defaults:
    put:
      operationId: setPricingDefaults
      summary: 设置全局缺省售价
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingDefaultsRequest'
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingDefaultsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Stopping'
  /api/pricing/batch:
    post:
      operationId: pricingBatch
      summary: 批量设置售价（mode=all|unpriced）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingBatchRequest'
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Stopping'
  /api/pricing/file:
    put:
      operationId: setPricingFile
      summary: 设置单文件售价
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingFileRequest'
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: clearPricingFile
      summary: 清除单文件覆写
      parameters:
        - name: rootId
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 已清除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingClearResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks:
    get:
      operationId: listTasks
      summary: 下载任务列表
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '412':
          $ref: '#/components/responses/NotInitialized'
    post:
      operationId: createTask
      summary: 创建下载任务（按 seed 幂等，已存在返回原任务）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: 已存在任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '201':
          description: 新建任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/NotInitialized'
        '423':
          $ref: '#/components/responses/Locked'
        '503':
          $ref: '#/components/responses/Stopping'
  /api/tasks/{seed}:
    get:
      operationId: getTask
      summary: 查询原任务（已提交后查询失败不得重复采购）
      parameters:
        - $ref: '#/components/parameters/SeedParam'
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/NotInitialized'
  /api/tasks/{seed}/events:
    get:
      operationId: taskEvents
      summary: 任务级 SSE（保留接口，先连接即发当前态，终态后关闭）
      parameters:
        - $ref: '#/components/parameters/SeedParam'
      responses:
        '200':
          description: text/event-stream，每帧 data 为 Task JSON
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks/{seed}/cancel:
    post:
      operationId: cancelTask
      summary: 显式取消任务（停止新增采购，有界收尾，保留证据）
      parameters:
        - $ref: '#/components/parameters/SeedParam'
      responses:
        '200':
          description: 已取消（幂等，终态返回 ok）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/events:
    get:
      operationId: subscribeEvents
      summary: 通用事件订阅（新增契约：快照+序号+实例ID，重连即重取快照）
      parameters:
        - name: topics
          in: query
          required: false
          description: 逗号分隔主题子集；省略表示全部；未知主题 400
          schema:
            type: string
      responses:
        '200':
          description: text/event-stream，事件类型 snapshot/change/resync，心跳为 SSE 注释
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    SeedParam:
      name: seed
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    RootIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
    RevisionQuery:
      name: revision
      in: query
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: 请求非法（v1 文本体，首轮保持原样）
    NotFound:
      description: 不存在（v1 文本体）
    Conflict:
      description: 版本冲突或业务冲突（v1 文本体，如 revision 过期、在途会话未收尾）
    Locked:
      description: 后台已锁定（423，需解锁而非重试/换后台）
    Stopping:
      description: 后台停止中（503）
    NotInitialized:
      description: 尚未初始化（412）
  schemas:
    Status:
      type: object
      required: [initialized, state, product, apiVersion]
      properties:
        initialized:
          type: boolean
        state:
          type: string
          enum: [uninitialized, locked, unlocked, stopping]
        network:
          type: string
        locked:
          type: boolean
        address:
          type: string
        publicKey:
          type: string
        product:
          type: string
          enum: ['km']
        apiVersion:
          type: string
          enum: [v1]
    Info:
      type: object
      required: [connected, network, locked, address]
      properties:
        connected:
          type: boolean
        network:
          type: string
        locked:
          type: boolean
        address:
          type: string
        totalSats:
          type: integer
          format: uint64
        availableSats:
          type: integer
          format: uint64
        allocatedSats:
          type: integer
          format: uint64
        queryTime:
          type: string
        cached:
          type: boolean
        error:
          type: string
    UnlockRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: 敏感请求字段，永不出现在响应/事件/日志中
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    RevisionRequest:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          format: int64
    RevisionedOk:
      type: object
      required: [ok, revision]
      properties:
        ok:
          type: boolean
        revision:
          type: integer
          format: int64
    Root:
      type: object
      required: [id, path]
      properties:
        id:
          type: string
        path:
          type: string
    RootView:
      type: object
      required: [id, path, accessible]
      properties:
        id:
          type: string
        path:
          type: string
        accessible:
          type: boolean
        error:
          type: string
    RootsView:
      type: object
      required: [roots, revision]
      properties:
        roots:
          type: array
          items:
            $ref: '#/components/schemas/RootView'
        defaultDownloadRootID:
          type: string
        revision:
          type: integer
          format: int64
    AddRootRequest:
      type: object
      required: [path, revision]
      properties:
        path:
          type: string
        revision:
          type: integer
          format: int64
    AddRootResponse:
      type: object
      required: [id, path, revision]
      properties:
        id:
          type: string
        path:
          type: string
        revision:
          type: integer
          format: int64
    SetDefaultRootRequest:
      type: object
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          format: int64
    FileView:
      type: object
      required: [rootId, path, name, seedHash, seedPrice, blockPrice, override, state]
      properties:
        rootId:
          type: string
        path:
          type: string
        name:
          type: string
        size:
          type: integer
          format: uint64
        seedHash:
          type: string
        blocks:
          type: integer
          format: uint64
        seedPrice:
          type: string
        blockPrice:
          type: string
        override:
          type: boolean
        state:
          type: string
        error:
          type: string
    FilesView:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileView'
    BrowseEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    BrowseView:
      type: object
      required: [path, dirs]
      properties:
        path:
          type: string
        parent:
          type: string
        dirs:
          type: array
          items:
            $ref: '#/components/schemas/BrowseEntry'
    SchedulerSettings:
      type: object
      required: [maxBlockPriceSatoshis, poolBlocks, totalSeats, floatingSeats, requestTimeoutMs]
      properties:
        maxBlockPriceSatoshis:
          type: string
        poolBlocks:
          type: integer
        totalSeats:
          type: integer
        floatingSeats:
          type: integer
        requestTimeoutMs:
          type: integer
    Supplier:
      type: object
      required: [id, name, publicKeyHex, multiaddrs, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        publicKeyHex:
          type: string
        multiaddrs:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    ArbitrationService:
      type: object
      properties:
        name:
          type: string
        publicKeyHex:
          type: string
        address:
          type: string
    Services:
      type: object
      required: [satSuppliers]
      properties:
        satSuppliers:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        arbitrationServices:
          type: array
          items:
            $ref: '#/components/schemas/ArbitrationService'
    CollectorEntry:
      type: object
      required: [id, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        endpoint:
          type: string
        enabled:
          type: boolean
    CollectorSettings:
      type: object
      required: [collectors, earlyTriggerCount, submitIntervalMs, retryBaseMs, retryCapMs]
      properties:
        collectors:
          type: array
          items:
            $ref: '#/components/schemas/CollectorEntry'
        earlyTriggerCount:
          type: integer
        submitIntervalMs:
          type: integer
          format: int64
        retryBaseMs:
          type: integer
          format: int64
        retryCapMs:
          type: integer
          format: int64
    ServerDefaults:
      type: object
